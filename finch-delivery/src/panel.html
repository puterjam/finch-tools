<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifacts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--finch-font-body, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
    background: var(--finch-bg-root, #f5f5f5);
    color: var(--finch-text-primary, #1a1a1a);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ── */
  #app {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .header .count {
    font-size: 13px;
    color: var(--finch-text-secondary, #666);
    background: var(--finch-bg-elevated, #fff);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--finch-border, #e0e0e0);
  }

  /* ── Filter tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--finch-bg-elevated, #fff);
    border-radius: 10px;
    padding: 3px;
    border: 1px solid var(--finch-border, #e0e0e0);
    width: fit-content;
  }
  .tab {
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--finch-text-secondary, #666);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .tab.active {
    background: var(--finch-accent, #3b82f6);
    color: #fff;
  }
  .tab:not(.active):hover {
    background: var(--finch-bg-hover, #f0f0f0);
  }

  /* ── Card grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* ── Card ── */
  .card {
    background: var(--finch-bg-elevated, #fff);
    border: 1px solid var(--finch-border, #ececec);
    border-radius: var(--finch-radius-md, 14px);
    cursor: pointer;
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 220px;
  }
  .card:hover {
    box-shadow: var(--finch-shadow-sm, 0 4px 16px rgba(0,0,0,0.08));
    border-color: var(--finch-border, #ececec);
  }
  .card:active {
    transform: scale(0.99);
  }

  /* ── Hover action overlay ── */
  .card-actions-overlay {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 2;
  }
  .card:hover .card-actions-overlay {
    opacity: 1;
  }
  .btn-icon {
    width: 26px;
    height: 26px;
    border: 1px solid var(--finch-border, #e0e0e0);
    background: var(--finch-bg-elevated, #fff);
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--finch-text-secondary, #666);
    transition: all 0.15s;
    text-decoration: none;
    font-family: inherit;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .btn-icon:hover {
    border-color: var(--finch-accent, #3b82f6);
    color: var(--finch-accent, #3b82f6);
  }
  .btn-icon.danger:hover {
    border-color: #e0533d;
    color: #e0533d;
  }

  /* ── Preview area (top, faded content) ── */
  .card-preview {
    flex: 1;
    min-height: 0;
    padding: 16px 16px 0;
    position: relative;
    overflow: hidden;
    font-size: 12px;
    line-height: 1.6;
    color: var(--finch-text-secondary, #666);
  }
  .card-preview::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 44px;
    background: linear-gradient(transparent, var(--finch-bg-elevated, #fff));
    pointer-events: none;
  }
  .preview-heading {
    font-size: 14px;
    font-weight: 700;
    color: var(--finch-text-primary, #1a1a1a);
    line-height: 1.4;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .preview-body {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .preview-placeholder {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--finch-text-tertiary, #b0b0b0);
  }
  .preview-placeholder .glyph {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 8px;
    background: var(--finch-bg-root, #f5f5f5);
  }
  .preview-placeholder .hint {
    font-size: 11px;
    color: var(--finch-text-tertiary, #b0b0b0);
    text-align: center;
    padding: 0 16px;
  }

  /* ── Footer (title + meta) ── */
  .card-footer {
    padding: 12px 16px 14px;
    border-top: 1px solid var(--finch-border, #f0f0f0);
    background: var(--finch-bg-elevated, #fff);
    position: relative;
    z-index: 1;
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--finch-text-primary, #1a1a1a);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
    margin-bottom: 6px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-time {
    font-size: 12px;
    color: var(--finch-text-tertiary, #999);
    white-space: nowrap;
  }
  .type-pill {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding: 2px 7px;
    border-radius: 5px;
    color: #fff;
    flex-shrink: 0;
  }
  .type-pill.md { background: #4a9eff; }
  .type-pill.word { background: #2b579a; }
  .type-pill.ppt { background: #d24726; }
  .type-pill.pdf { background: #e0533d; }
  .type-pill.excel { background: #217346; }
  .type-pill.web { background: #e8a317; }
  .type-pill.image { background: #9b59b6; }
  .type-pill.other { background: #6b7280; }

  .session-tag {
    font-size: 10px;
    color: var(--finch-accent, #3b82f6);
    font-weight: 600;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--finch-text-tertiary, #999);
  }
  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }
  .empty-text {
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>📦 Artifacts</h1>
    <span class="count" id="count">0 files</span>
  </div>

  <div class="tabs">
    <button class="tab" data-filter="current">Current Session</button>
    <button class="tab active" data-filter="all">All Sessions</button>
  </div>

  <div id="content"></div>
</div>

<script>
(function() {
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────
  var deliveries = [];
  var currentSessionId = '';
  // Default to "All" — this page opens both as a Session-scoped Panel App
  // (which has a real sessionId) and as an application-level Full View
  // sidebar entry (which has no session concept). We auto-switch to
  // "current" once a real sessionId arrives, unless the user already
  // picked a tab themselves.
  var filterMode = 'all'; // 'current' | 'all'
  var userPickedTab = false;

  // ── Finch Bridge ───────────────────────────────────────────────────────
  var finchApi = (window).finch;
  // Set from `finch:env.view` once it arrives — 'appView' when this page is
  // the application-level sidebar entry (Appview), vs 'session'/'home'/
  // 'container' when it's the right-side Panel App instance. File preview
  // must route differently depending on which surface hosts the page.
  var currentView = '';

  // ── DOM ────────────────────────────────────────────────────────────────
  var contentEl = document.getElementById('content');
  var countEl = document.getElementById('count');
  var tabs = document.querySelectorAll('.tab');

  function setActiveTab(mode) {
    filterMode = mode;
    tabs.forEach(function(t) {
      t.classList.toggle('active', t.dataset.filter === mode);
    });
  }

  // ── Tabs ───────────────────────────────────────────────────────────────
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      userPickedTab = true;
      setActiveTab(tab.dataset.filter);
      render();
    });
  });

  function onSessionIdKnown(sessionId) {
    if (!sessionId || currentSessionId === sessionId) return;
    currentSessionId = sessionId;
    if (!userPickedTab) setActiveTab('current');
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function formatTime(ts) {
    var d = new Date(ts);
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    var hours = String(d.getHours()).padStart(2, '0');
    var mins = String(d.getMinutes()).padStart(2, '0');
    return month + '-' + day + ' ' + hours + ':' + mins;
  }

  function formatRelativeTime(ts) {
    var diff = Math.max(0, Date.now() - ts) / 1000; // seconds
    if (diff < 60) return 'Edited just now';
    if (diff < 3600) {
      var m = Math.floor(diff / 60);
      return 'Edited ' + m + ' minute' + (m !== 1 ? 's' : '') + ' ago';
    }
    if (diff < 86400) {
      var h = Math.floor(diff / 3600);
      return 'Edited ' + h + ' hour' + (h !== 1 ? 's' : '') + ' ago';
    }
    if (diff < 30 * 86400) {
      var d = Math.floor(diff / 86400);
      return 'Edited ' + d + ' day' + (d !== 1 ? 's' : '') + ' ago';
    }
    if (diff < 365 * 86400) {
      var mo = Math.floor(diff / (30 * 86400));
      return 'Edited ' + mo + ' month' + (mo !== 1 ? 's' : '') + ' ago';
    }
    var y = Math.floor(diff / (365 * 86400));
    return 'Edited ' + y + ' year' + (y !== 1 ? 's' : '') + ' ago';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** Build the faded preview-area content for a card. */
  function buildPreviewHtml(r) {
    var src = r.textPreview || r.description || '';
    if (!src) {
      return '<div class="preview-placeholder">' +
        '<span class="glyph">' + r.fileType + '</span>' +
        '<span class="hint">No preview available</span>' +
        '</div>';
    }

    if (r.textPreview) {
      // Split first heading line (starts with #) from the rest.
      var lines = src.split('\n');
      var headingLine = '';
      var bodyStart = 0;
      var firstNonEmpty = lines.findIndex(function(l) { return l.trim() !== ''; });
      if (firstNonEmpty !== -1 && /^#{1,6}\s+/.test(lines[firstNonEmpty])) {
        headingLine = lines[firstNonEmpty].replace(/^#{1,6}\s+/, '');
        bodyStart = firstNonEmpty + 1;
      }
      var body = lines.slice(bodyStart).join('\n').trim();
      var html = '';
      if (headingLine) {
        html += '<div class="preview-heading">' + escapeHtml(headingLine) + '</div>';
      }
      html += '<div class="preview-body">' + escapeHtml(body || src) + '</div>';
      return html;
    }

    // Fallback: description only
    return '<div class="preview-body">' + escapeHtml(src) + '</div>';
  }

  function getFiltered() {
    if (filterMode === 'current' && currentSessionId) {
      return deliveries.filter(function(r) { return r.sessionId === currentSessionId; });
    }
    return deliveries;
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function render() {
    var filtered = getFiltered();
    countEl.textContent = filtered.length + ' file' + (filtered.length !== 1 ? 's' : '');

    if (filtered.length === 0) {
      contentEl.innerHTML =
        '<div class="empty">' +
        '<div class="empty-icon">📦</div>' +
        '<div class="empty-text">' +
          (filterMode === 'current'
            ? 'No deliverables in this session yet.<br>Ask the AI to create a document — it will show up here.'
            : 'No deliverables yet.<br>Ask the AI to create a document — it will show up here.') +
        '</div></div>';
      return;
    }

    // Sort by createdAt descending
    var sorted = filtered.slice().sort(function(a, b) { return b.createdAt - a.createdAt; });

    var html = '<div class="grid">';
    sorted.forEach(function(r) {
      var isCurrent = r.sessionId === currentSessionId;
      var sessionLabel = escapeHtml(r.sessionTitle || (r.sessionId ? r.sessionId.slice(0, 8) : 'unknown'));

      html += '<div class="card" data-id="' + r.id + '">';

      html += '<div class="card-actions-overlay">';
      html += '<a class="btn-icon" href="finch://open?id=' + encodeURIComponent(r.sessionId) + '" title="Jump to session" onclick="event.stopPropagation()">↗</a>';
      html += '<button class="btn-icon danger" data-remove="' + r.id + '" title="Remove">✕</button>';
      html += '</div>';

      html += '<div class="card-preview">' + buildPreviewHtml(r) + '</div>';

      html += '<div class="card-footer">';
      html += '<div class="card-title">' + escapeHtml(r.title) + '</div>';
      html += '<div class="card-meta">';
      html += '<span class="card-time">' + formatRelativeTime(r.createdAt) + '</span>';
      if (filterMode === 'all' && !isCurrent) {
        html += '<span class="session-tag">' + sessionLabel + '</span>';
      } else {
        html += '<span class="type-pill ' + r.fileType + '">' + r.fileType + '</span>';
      }
      html += '</div>';
      html += '</div>';

      html += '</div>';
    });
    html += '</div>';
    contentEl.innerHTML = html;

    // Attach event listeners
    var cards = contentEl.querySelectorAll('.card');
    cards.forEach(function(card) {
      var id = card.dataset.id;

      // Card click → open the file in Finch's native file preview
      card.addEventListener('click', function(e) {
        // Don't trigger if clicking a button or link
        if (e.target.closest('.btn-icon') || e.target.closest('a')) return;

        var record = deliveries.find(function(r) { return r.id === id; });
        if (!record || !record.filePath) return;

        // In Appview, ctx.ui.openFilePreview() would open the file in the
        // right-side Panel — a surface Appview doesn't render — so nothing
        // visibly happens. Push it onto this App View's own navigation
        // stack instead. Falls back to the old backend round trip when
        // running as a right-Panel App instance (currentView !== 'appView').
        if (currentView === 'appView' && finchApi && finchApi.appView && finchApi.appView.openPreview) {
          finchApi.appView.openPreview(record.filePath).catch(function (err) {
            console.error('[finch-delivery] appView.openPreview failed:', err);
          });
        } else if (finchApi) {
          finchApi.postMessage({ type: 'openPreview', filePath: record.filePath });
        }
      });
    });

    // Remove buttons
    var removeBtns = contentEl.querySelectorAll('[data-remove]');
    removeBtns.forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = btn.dataset.remove;
        if (finchApi) {
          finchApi.postMessage({ type: 'remove', id: id });
        }
      });
    });
  }

  // ── Finch bridge messages ──────────────────────────────────────────────
  if (finchApi && finchApi.onMessage) {
    finchApi.onMessage(function(message) {
      if (!message || typeof message !== 'object') return;

      // Handle finch:env
      if (message.type === 'finch:env') {
        currentView = message.view || '';
        onSessionIdKnown(message.sessionId || '');
        render();
        return;
      }

      // Handle deliveries data
      if (message.type === 'deliveries') {
        deliveries = message.data || [];
        if (message.env && message.env.sessionId) {
          onSessionIdKnown(message.env.sessionId);
        }
        render();
        return;
      }
    });
  }

  // ── Initial render ─────────────────────────────────────────────────────
  render();

  // Request data from backend
  if (finchApi && finchApi.postMessage) {
    finchApi.postMessage({ type: 'requestDeliveries' });
  }
})();
</script>
</body>
</html>

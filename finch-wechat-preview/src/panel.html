<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公众号文章预览</title>
<style>
:root{
  --bg:var(--finch-bg-root,#f7f7f8);
  --card:var(--finch-bg-elevated,#fff);
  --text:var(--finch-text-primary,#1d1d20);
  --muted:var(--finch-text-secondary,#777);
  --border:var(--finch-border,#ddd);
  --accent:var(--finch-accent,#3f6b56);
}
@media (prefers-color-scheme: dark) {
  :root{
    --bg:var(--finch-bg-root,#17171a);
    --card:var(--finch-bg-elevated,#242429);
    --text:var(--finch-text-primary,#eee);
    --muted:var(--finch-text-secondary,#aaa);
    --border:var(--finch-border,#3c3c43);
    --accent:var(--finch-accent,#70a889);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px var(--finch-font-body,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif)}
.app{width:100%;height:100vh;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:block}
.editor-wrap{position:relative;width:100%;height:100%;background:var(--card)}
#editor-highlight,#editor{position:absolute;inset:0;margin:0;padding:20px 24px;font:13.5px/1.7 var(--finch-font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);white-space:pre-wrap;word-wrap:break-word;overflow:auto}
#editor-highlight{color:var(--text);pointer-events:none;user-select:none}
#editor{width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:transparent;caret-color:var(--text)}
#editor::selection{background:rgba(63,107,86,.35)}
.tok-heading{color:var(--accent);font-weight:700}
.tok-bold{font-weight:700;color:var(--text)}
.tok-italic{font-style:italic}
.tok-inline-code{font-family:var(--finch-font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);background:rgba(127,127,127,.18);border-radius:3px}
.tok-quote{color:var(--muted)}
.tok-list{color:var(--text)}
.tok-fence,.tok-code-block{color:var(--muted);background:rgba(127,127,127,.08)}
.tok-link-text{color:var(--accent)}
.tok-link-url{color:var(--muted);text-decoration:underline}
#article{display:block;width:100%;height:100%;border:0;background:#fff}
.empty{position:absolute;inset:0;background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:14px;line-height:1.7}
.empty[hidden]{display:none}
.status{font-size:12px;color:var(--muted);padding:5px 10px;text-align:center;border-top:1px solid var(--border);background:var(--bg)}
.status.error{color:#c54232}
.status:empty{padding:0;border-top:0}
.popup{position:fixed;z-index:20;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 22px rgba(0,0,0,.22);padding:5px}
.popup.hidden{display:none}
.popup input{width:220px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:4px 6px}
.popup button{font:inherit;border:0;background:var(--accent);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.popup button:hover{opacity:.9}
</style>
</head>
<body>
<main class="app">
  <div class="stage">
    <div id="empty" class="empty">点击工具栏「打开文章」，选择一个 Markdown 文件开始编辑与预览。</div>
    <div id="editPane" class="pane">
      <div class="editor-wrap">
        <pre id="editor-highlight" aria-hidden="true"></pre>
        <textarea id="editor" placeholder="在此输入或粘贴 Markdown…" spellcheck="false"></textarea>
      </div>
    </div>
    <div id="previewPane" class="pane">
      <iframe id="article" sandbox="allow-same-origin" title="公众号文章预览"></iframe>
    </div>
  </div>
  <div id="status" class="status"></div>
</main>
<section id="popup" class="popup hidden">
  <input id="popupInput" type="text" placeholder="让 AI 怎么改这段？">
  <button id="popupSend">发送</button>
</section>
<script>
(function () {
  'use strict';
  var api = window.finch;

  var empty = document.getElementById('empty');
  var editPane = document.getElementById('editPane');
  var previewPane = document.getElementById('previewPane');
  var editor = document.getElementById('editor');
  var highlightEl = document.getElementById('editor-highlight');
  var frame = document.getElementById('article');
  var statusEl = document.getElementById('status');
  var popup = document.getElementById('popup');
  var popupInput = document.getElementById('popupInput');
  var popupSend = document.getElementById('popupSend');

  var pickFileSupported = false; // set from the backend 'ready' message
  var mode = 'edit';          // 'edit' | 'preview'
  var style = 'kami';
  var customCss = '';
  var markdown = '';
  var name = '';
  var sourcePath = '';
  var savedMarkdown = null;   // last markdown value confirmed written to disk
  var html = '';
  var frameReady = false;
  var renderId = 0;
  var saveId = 0;
  var saveTimer = 0;
  var fileHandle = null;
  var lastModified = 0;
  var watchTimer = 0;
  var watchBusy = false;
  var selection = { text: '' };

  function setStatus(text, isError) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (isError ? ' error' : '');
  }

  function hasDocument() { return !!markdown || !!sourcePath; }

  function updateEmptyState() {
    empty.hidden = hasDocument();
  }

  function showPane() {
    editPane.classList.toggle('active', mode === 'edit');
    previewPane.classList.toggle('active', mode === 'preview');
  }

  function sendToolbar(itemId, patch) {
    if (api) api.postMessage({ type: 'updateToolbar', itemId: itemId, patch: patch });
  }

  function setMode(next) {
    mode = next;
    showPane();
    sendToolbar('mode', {
      label: mode === 'edit' ? '预览' : '编辑',
      icon: mode === 'edit' ? 'toggle-left' : 'toggle-right',
      tooltip: mode === 'edit' ? '切换到预览' : '切换到编辑',
    });
    if (mode === 'preview') render();
  }

  // ---- Lightweight Markdown syntax highlighting (overlay <pre> behind the textarea) ----

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function highlightInline(escaped) {
    return escaped
      .replace(/(`+)([^`]+?)\1/g, '<span class="tok-inline-code">$1$2$1</span>')
      .replace(/(\*\*|__)([^\n]+?)\1/g, '<span class="tok-bold">$1$2$1</span>')
      .replace(/(^|[^*_\w])(\*|_)([^*_\n]+?)\2(?!\2)/g, '$1<span class="tok-italic">$2$3$2</span>')
      .replace(/(!?\[)([^\]]*)(\]\()([^)]+)(\))/g, '$1<span class="tok-link-text">$2</span>$3<span class="tok-link-url">$4</span>$5');
  }

  function highlightMarkdown(src) {
    var inFence = false;
    return src.split('\n').map(function (line) {
      if (/^\s*(```|~~~)/.test(line)) {
        inFence = !inFence;
        return '<span class="tok-fence">' + escapeHtml(line) + '</span>';
      }
      if (inFence) return '<span class="tok-code-block">' + escapeHtml(line) + '</span>';
      if (/^#{1,6}(\s+.*)?$/.test(line)) return '<span class="tok-heading">' + escapeHtml(line) + '</span>';
      var body = highlightInline(escapeHtml(line));
      if (/^\s*>+\s?/.test(line)) return '<span class="tok-quote">' + body + '</span>';
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) return '<span class="tok-list">' + body + '</span>';
      return body;
    }).join('\n');
  }

  function updateHighlight() {
    highlightEl.innerHTML = highlightMarkdown(editor.value) + '\n';
  }

  editor.addEventListener('scroll', function () {
    highlightEl.scrollTop = editor.scrollTop;
    highlightEl.scrollLeft = editor.scrollLeft;
  });

  // ---- Markdown <-> bm.md rendering ----

  function activeCustomCss() { return style === 'custom' ? customCss : ''; }

  function render() {
    if (!markdown || !api) return;
    var id = ++renderId;
    setStatus('正在渲染…');
    api.postMessage({
      type: 'renderBm',
      markdown: markdown,
      markdownStyle: style === 'custom' ? 'kami' : style,
      customCss: activeCustomCss(),
      requestId: id,
    });
  }

  function captureScroll() {
    var d = frame.contentDocument, e = d && d.scrollingElement;
    if (!e) return null;
    return { top: e.scrollTop };
  }

  function restoreScroll(saved) {
    var d = frame.contentDocument, e = d && d.scrollingElement;
    if (!saved || !e) return;
    e.scrollTop = Math.min(saved.top, Math.max(0, e.scrollHeight - e.clientHeight));
  }

  function showHtml(next) {
    var previous = captureScroll();
    var d = frame.contentDocument;
    html = next;
    if (frameReady && d && d.body) {
      d.body.innerHTML = html;
      restoreScroll(previous);
      bindPreviewSelection();
      return;
    }
    frame.srcdoc = '<!doctype html><meta charset="utf-8"><base target="_blank">' +
      '<style>html,body{margin:0!important;padding:0!important}#bm-md{margin-top:0!important;padding-top:0!important}</style>' +
      '<body>' + html;
  }

  function bindPreviewSelection() {
    var d = frame.contentDocument;
    if (!d || d.__bound) return;
    d.__bound = true;
    function picked() {
      var w = frame.contentWindow;
      var s = w.getSelection();
      var text = s.toString().trim();
      if (!text || !s.rangeCount) return;
      var rect = s.getRangeAt(0).getBoundingClientRect();
      var frameRect = frame.getBoundingClientRect();
      openPopup(text, frameRect.top + rect.top, frameRect.top + rect.bottom, frameRect.left + rect.left + rect.width / 2);
    }
    d.addEventListener('mouseup', picked);
    d.addEventListener('keyup', picked);
  }

  frame.onload = function () { frameReady = true; bindPreviewSelection(); };

  // ---- Selection popup (editor + preview share this) ----
  // top/bottom describe the selection's bounding box in viewport coordinates;
  // the popup prefers sitting above the selection, and drops below it when
  // there isn't enough room above (near the top of the panel).

  function openPopup(text, top, bottom, centerX) {
    selection.text = text;
    popup.classList.remove('hidden');
    popupInput.value = '';
    requestAnimationFrame(function () {
      positionPopup(top, bottom, centerX);
      popupInput.focus();
    });
  }

  function positionPopup(top, bottom, centerX) {
    var margin = 8;
    var w = popup.offsetWidth || 300;
    var h = popup.offsetHeight || 44;
    var left = Math.max(margin, Math.min(centerX - w / 2, window.innerWidth - w - margin));
    var y = (top - margin >= h + 10) ? (top - h - 10) : (bottom + 10);
    y = Math.max(margin, Math.min(y, window.innerHeight - h - margin));
    popup.style.left = left + 'px';
    popup.style.top = y + 'px';
  }

  // ---- Measure a textarea selection's on-screen rect (mirror-div technique) ----

  var mirror = document.createElement('div');
  mirror.style.position = 'fixed';
  mirror.style.visibility = 'hidden';
  mirror.style.top = '0';
  mirror.style.left = '-9999px';
  mirror.style.height = 'auto';
  mirror.style.pointerEvents = 'none';
  document.body.appendChild(mirror);

  var MIRROR_PROPS = ['boxSizing', 'width', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
    'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
    'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'lineHeight', 'letterSpacing',
    'tabSize', 'whiteSpace', 'wordWrap', 'wordBreak'];

  function measureSelectionRect(ta) {
    var cs = getComputedStyle(ta);
    MIRROR_PROPS.forEach(function (p) { mirror.style[p] = cs[p]; });
    var value = ta.value, start = ta.selectionStart, end = ta.selectionEnd;
    mirror.textContent = '';
    mirror.appendChild(document.createTextNode(value.slice(0, start)));
    var span = document.createElement('span');
    span.textContent = value.slice(start, end) || '\u200b';
    mirror.appendChild(span);
    mirror.appendChild(document.createTextNode(value.slice(end)));
    var mirrorRect = mirror.getBoundingClientRect();
    var spanRect = span.getBoundingClientRect();
    var taRect = ta.getBoundingClientRect();
    return {
      top: taRect.top + (spanRect.top - mirrorRect.top) - ta.scrollTop,
      bottom: taRect.top + (spanRect.bottom - mirrorRect.top) - ta.scrollTop,
      left: taRect.left + (spanRect.left - mirrorRect.left) - ta.scrollLeft,
      right: taRect.left + (spanRect.right - mirrorRect.left) - ta.scrollLeft,
    };
  }

  function closePopup() {
    popup.classList.add('hidden');
    selection.text = '';
  }

  popupSend.onclick = submitAnnotation;
  popupInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitAnnotation();
    if (e.key === 'Escape') closePopup();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !popup.classList.contains('hidden')) closePopup();
  });

  async function submitAnnotation() {
    var comment = popupInput.value.trim();
    if (!selection.text || !api || !api.composer) return;
    try {
      await api.composer.addContexts([{
        type: 'annotation',
        label: name || '公众号文章批注',
        note: comment || undefined,
        promptText: '请改写这段公众号文章内容（Markdown 原文），' + (comment ? '要求：' + comment : '让它更好') +
          '：\n\n' + selection.text + '\n\n请给出精确、可直接替换的 Markdown 片段。若我确认使用，请调用 wechat_preview_document 工具的 apply 动作，' +
          '用替换后的完整文章更新源文件（path=' + (sourcePath || '（未关联本地文件，请让我先粘贴/保存全文）') + '）。',
        reminder: '仅给出改写建议，不要在未确认前直接写入源文件。',
      }]);
      closePopup();
      setStatus('批注已加入输入框。');
    } catch (e) {
      setStatus(String(e), true);
    }
  }

  // ---- Editor selection ----

  editor.addEventListener('mouseup', function () {
    var start = editor.selectionStart, end = editor.selectionEnd;
    if (end <= start) return;
    var text = editor.value.slice(start, end).trim();
    if (!text) return;
    var r = measureSelectionRect(editor);
    openPopup(text, r.top, r.bottom, (r.left + r.right) / 2);
  });

  // ---- Save to disk: prefer the File System Access handle (works even when the
  // host process can't expose an absolute path), fall back to the backend write
  // when we have a real sourcePath, otherwise tell the user how to connect one. ----

  async function writeToDisk(content) {
    if (fileHandle && fileHandle.createWritable) {
      try {
        var writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
        lastModified = (await fileHandle.getFile()).lastModified;
        savedMarkdown = content;
        setStatus('已保存。');
        return true;
      } catch (e) {
        setStatus('保存失败：' + String(e), true);
        return false;
      }
    }
    if (sourcePath) {
      var id = ++saveId;
      setStatus('正在保存…');
      api.postMessage({ type: 'saveMarkdown', path: sourcePath, markdown: content, requestId: id });
      return true;
    }
    setStatus('未关联本地文件：点击工具栏「打开文章」重新选择一次，即可自动关联并开启自动保存。', true);
    return false;
  }

  // ---- Editor autosave ----

  editor.addEventListener('input', function () {
    markdown = editor.value;
    updateHighlight();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { writeToDisk(markdown); }, 800);
  });

  // ---- Open / watch source file ----

  function stopWatching() {
    if (watchTimer) { clearInterval(watchTimer); watchTimer = 0; }
    fileHandle = null;
  }

  function applyDocument(nextMarkdown, nextName, nextPath) {
    markdown = nextMarkdown;
    name = nextName;
    if (nextPath) sourcePath = nextPath;
    savedMarkdown = markdown;
    if (document.activeElement !== editor) {
      editor.value = markdown;
      updateHighlight();
    }
    updateEmptyState();
    if (mode === 'preview') render();
  }

  async function loadFile(f) {
    name = f.name;
    lastModified = f.lastModified;
    if (typeof f.path === 'string' && f.path) {
      sourcePath = f.path;
      if (api) api.postMessage({ type: 'watchPath', path: sourcePath });
    }
    applyDocument(await f.text(), name, sourcePath);
    setMode('preview');
  }

  function watchFile() {
    if (!fileHandle) return;
    if (watchTimer) clearInterval(watchTimer);
    watchTimer = setInterval(async function () {
      if (watchBusy || !fileHandle) return;
      watchBusy = true;
      try {
        var next = await fileHandle.getFile();
        if (next.lastModified !== lastModified) {
          lastModified = next.lastModified;
          var text = await next.text();
          if (text !== savedMarkdown) {
            applyDocument(text, name, sourcePath);
            setStatus('检测到文件更新，已刷新。');
          }
        }
      } catch (e) { /* ignore */ }
      watchBusy = false;
    }, 800);
  }

  var nativePickPending = false;

  async function openFile() {
    stopWatching();
    if (pickFileSupported && api && api.postMessage) {
      if (nativePickPending) {
        // A previous native request is still hanging (host round-trip stuck).
        // Don't stack another one silently — this click is a fresh, real user
        // gesture, so use it to open the reliable in-page/browser picker
        // immediately instead of leaving the button looking unresponsive.
        pickFileSupported = false;
        nativePickPending = false;
        await openFileBrowserFallback();
        return;
      }
      // Native Finch file picker: browses the current Space/workspace directory
      // tree with real absolute paths, no Electron `File.path` shim needed.
      nativePickPending = true;
      setStatus('正在打开文件选择器…');
      api.postMessage({ type: 'requestOpen' });
      return;
    }
    await openFileBrowserFallback();
  }

  async function openFileBrowserFallback() {
    if ('showOpenFilePicker' in window) {
      try {
        var handles = await window.showOpenFilePicker({
          types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown'] } }],
          multiple: false,
        });
        fileHandle = handles[0];
        await loadFile(await fileHandle.getFile());
        watchFile();
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.md,.markdown,text/markdown';
    input.onchange = function () {
      var f = input.files && input.files[0];
      if (f) loadFile(f).catch(function (e) { setStatus(String(e), true); });
    };
    input.click();
  }

  // ---- Copy HTML / manual save ----

  async function copyHtml() {
    if (!html) { setStatus('请先打开文章。', true); return; }
    try {
      var plain = frame.contentDocument ? frame.contentDocument.body.innerText : html.replace(/<[^>]+>/g, '');
      if (!window.ClipboardItem || !navigator.clipboard.write) throw new Error('当前环境不支持富文本剪贴板。');
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' }),
      })]);
      setStatus('公众号富文本 HTML 已复制。');
    } catch (e) {
      setStatus('富文本复制失败：' + String(e), true);
    }
  }

  function saveNow() {
    writeToDisk(markdown);
  }

  async function askAiStyle() {
    if (!markdown || !api || !api.composer) { setStatus('请先打开文章。', true); return; }
    var baseNote = style === 'custom' ? '当前基础风格是 kami（自定义 CSS 叠加其上）' : ('当前基础风格是 ' + style);
    try {
      await api.composer.addContexts([{
        type: 'annotation',
        label: name || '公众号文章排版',
        note: 'AI 一键排版',
        promptText: '请为这篇公众号文章设计一套自定义排版 CSS。' + baseNote + '，你的 CSS 会叠加在基础风格之上。' +
          '要求：只写普通 CSS 规则，选择器限定在 #bm-md 下的标签/结构（如 #bm-md h1、#bm-md p、#bm-md blockquote、#bm-md pre code、#bm-md a、#bm-md strong、#bm-md table 等），' +
          '不要使用 class（bm.md 输出没有 class，只有内联样式），必要时用 !important 覆盖基础风格。' +
          '可参考 bm.md 内置风格的设计语言：kami（暖色纸感）、bauhaus（几何撞色）、blueprint（技术蓝图网格）、botanical（清新绿意）、newsprint（报刊衬线）、retro（复古怀旧）、sketch（手绘风）、terminal（等宽暗色终端风）。' +
          '文章路径：' + (sourcePath || '（未关联本地文件）') + '。' +
          '设计完成后，调用 wechat_preview_document 工具的 set_style 动作，传入 css 与简短 label，我会在预览里立即看到效果。',
        reminder: '直接调用 set_style 应用即可，无需用户先确认，因为效果可在预览中随时撤销重来。',
      }]);
      setStatus('已请求 AI 设计自定义排版。');
    } catch (e) {
      setStatus(String(e), true);
    }
  }

  // ---- Toolbar (finch:menu) ----

  function setStyle(next) {
    style = next;
    if (mode === 'preview') render();
  }

  function handleMenu(itemId) {
    if (api && api.postMessage) api.postMessage({ type: 'clientLog', message: 'finch:menu received, itemId=' + itemId });
    if (itemId === 'open') { openFile(); return; }
    if (itemId === 'mode') { setMode(mode === 'edit' ? 'preview' : 'edit'); return; }
    if (itemId === 'copy') { copyHtml(); return; }
    if (itemId === 'ai-style') { askAiStyle(); return; }
    if (itemId === 'save') { saveNow(); return; }
    if (itemId === 'reload') { render(); return; }
    if (itemId === 'about') { setStatus('渲染器：本机 bmmd CLI（bm.md，AGPL-3.0）。'); return; }
    if (itemId && itemId.indexOf('style:') === 0) { setStyle(itemId.slice(6)); return; }
  }

  // ---- Backend messages ----

  if (api && api.onMessage) {
    api.onMessage(function (m) {
      if (!m || typeof m !== 'object') return;
      if (m.type === 'ready') { pickFileSupported = !!m.pickFileSupported; return; }
      if (m.type === 'finch:menu') { handleMenu(m.itemId); return; }
      if (m.type === 'document') {
        nativePickPending = false;
        var incoming = m.markdown || '';
        if (incoming === savedMarkdown) return; // echo of our own save
        var isFirst = savedMarkdown === null;
        applyDocument(incoming, m.title || '公众号文章', m.path || sourcePath);
        if (isFirst) setMode('preview'); else setStatus('内容已更新。');
        return;
      }
      if (m.type === 'bmRendered') {
        if (m.requestId !== renderId) return;
        showHtml(m.html || '');
        updateEmptyState();
        setStatus('');
        return;
      }
      if (m.type === 'savedMarkdown') {
        if (m.requestId !== saveId) return;
        savedMarkdown = markdown;
        setStatus('已保存。');
        return;
      }
      if (m.type === 'customStyleSet') {
        customCss = m.css || '';
        style = 'custom';
        setStatus((m.label ? m.label + ' · ' : '') + '自定义风格已应用。');
        if (mode === 'preview') render(); else setMode('preview');
        return;
      }
      if (m.type === 'watchStarted') { return; }
      if (m.type === 'error') {
        // A `fallback` error means the native picker timed out or errored on the
        // backend. We cannot silently re-trigger the OS file dialog here — Chromium
        // only allows showOpenFilePicker()/<input>.click() inside a real, still-fresh
        // user gesture, and this message arrives asynchronously well after the click
        // that started it. So just stop trusting the native path for the rest of this
        // session; the next "Open article" click (a fresh gesture) uses the reliable
        // in-page picker directly instead of hanging again.
        nativePickPending = false;
        if (m.fallback) pickFileSupported = false;
        setStatus(m.message, true);
        return;
      }
    });
  }

  // The host's own initial `ready` push (sent right when the panel is created,
  // from `onDidOpenPanel`) races against this guest page loading and attaching
  // the `api.onMessage` listener above — it can be sent before we're listening
  // and silently lost, permanently leaving `pickFileSupported` at its default
  // `false`. So instead of only relying on that push, we ask for it ourselves
  // once we're actually ready to receive the answer; by construction that
  // request can't be sent before our own listener exists.
  if (api && api.postMessage) api.postMessage({ type: 'panelReady' });

  updateEmptyState();
  showPane();
})();
</script>
</body>
</html>

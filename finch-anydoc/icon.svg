<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfa"/>
      <stop offset="1" stop-color="#e6e6e3"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- app card -->
  <g filter="url(#drop)">
    <rect x="12" y="10" width="176" height="176" rx="41" fill="url(#card)"/>
    <rect x="12.5" y="10.5" width="175" height="175" rx="40.5" fill="none" stroke="#ffffff" stroke-opacity="0.9"/>
  </g>

  <!-- stacked pages behind, hinting at many formats -->
  <rect x="52" y="60" width="66" height="92" rx="9" fill="#c3c3bf"/>
  <rect x="61" y="54" width="66" height="98" rx="9" fill="#a9a9a4"/>

  <!-- front page with a folded corner -->
  <path d="M78 44 h40 l22 22 v82 a8 8 0 0 1 -8 8 h-54 a8 8 0 0 1 -8 -8 v-96 a8 8 0 0 1 8 -8 z"
        fill="url(#page)"/>
  <path d="M118 44 l22 22 h-16 a6 6 0 0 1 -6 -6 z" fill="#5c5c5c"/>

  <!-- extracted content: a teal heading plus body lines -->
  <rect x="86" y="82" width="34" height="9" rx="4.5" fill="#4fd6c1"/>
  <rect x="86" y="100" width="44" height="6" rx="3" fill="#f0f0ee"/>
  <rect x="86" y="112" width="44" height="6" rx="3" fill="#f0f0ee"/>
  <rect x="86" y="124" width="27" height="6" rx="3" fill="#9a9a97"/>
</svg>

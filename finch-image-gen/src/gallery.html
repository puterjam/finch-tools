<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image 2.5</title>
  <link rel="stylesheet" href="gallery.css">
  <script defer src="gallery.js"></script>
</head>
<body>
<main id="app">
  <header class="header">
    <div class="title-group"><span class="title-icon" data-icon="book-image"></span><h1 id="title"></h1></div>
    <span class="count" id="count"></span>
  </header>
  <nav id="tabs" class="tabs" aria-label="Gallery filters"></nav>
  <div id="grid"></div>
  <section id="empty" class="empty" hidden><span data-icon="image"></span><h2 id="emptyTitle"></h2><p id="emptyHint"></p></section>
</main>

<!-- This route occupies the webview, never the OS window or an oversized modal. -->
<section id="editor" hidden aria-labelledby="editorTitle">
  <header class="editor-header">
    <button id="back" class="icon-button" type="button" data-icon="arrow-left"></button>
    <div class="editor-heading"><h2 id="editorTitle"></h2><p id="editorMeta"></p></div>
    <span id="saveState" class="muted" role="status"></span>
  </header>
  <div id="stage" class="stage">
    <div id="imageSurface" class="image-surface" hidden>
      <img id="editorImage" alt="" draggable="false">
      <svg id="inkLayer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      <div id="pins"></div>
    </div>
    <div id="imageStatus" class="image-status" role="status"></div>
  </div>
  <div class="editor-bottom">
    <div id="toolbar" class="toolbar" role="toolbar">
      <button id="toolPen" class="tool" type="button" data-mode="pen"><span data-icon="pencil-line"></span><span data-text="editor.draw"></span></button>
      <button id="toolComment" class="tool" type="button" data-mode="comment"><span data-icon="message-square-plus"></span><span data-text="editor.comment"></span></button>
      <span class="divider"></span>
      <button id="undo" class="tool icon-only" type="button" data-icon="undo-2"></button>
      <button id="clear" class="tool icon-only" type="button" data-icon="eraser"></button>
    </div>
    <p id="toolHint" class="tool-hint" role="status"></p>
    <section id="comments" class="comments" hidden>
      <header class="comments-header"><span id="commentsTitle"></span><button id="addComment" class="text-button" type="button" data-icon="plus"></button></header>
      <div id="commentList" class="comment-list"></div>
    </section>
    <div class="overall-note"><textarea id="overallNote" rows="1"></textarea></div>
    <div id="insertActions" class="insert-actions">
      <button id="insertOriginal" class="button" type="button"><span data-icon="image"></span><span data-text="editor.insertOriginal"></span></button>
      <button id="insertAnnotated" class="button primary" type="button"><span data-icon="corner-down-left"></span><span data-text="editor.insert"></span></button>
      <button id="sendToSession" class="button primary" type="button" hidden><span data-icon="send"></span><span data-text="editor.send"></span></button>
    </div>
    <p id="scopeHint" class="scope-hint" hidden></p>
    <p id="editorError" class="error" role="alert" hidden></p>
  </div>
</section>
<div id="notice" class="notice" role="status" hidden></div>
</body>
</html>
